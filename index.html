<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crop Production Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: a teacher's field notebook – warm, plain-spoken, exam-ready.
   IDEA: a soil pit cut open – the page reads top-down like horizons in a profile.
   PICTURE: a full-width soil cross-section under a crop field, horizons O–R labelled.
   COLOUR and TYPE: soil brown dominant, crop green support, ripe-wheat gold accent; Zilla Slab titles, Source Sans 3 text.
   LAYOUT: sticky top bar, hero scene, then bands; lessons get a sticky contents rail and a reading column. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#17110c);--ink:light-dark(#2a1d13,#f1e7dc);--muted:light-dark(#6e5a49,#c2ae9b);
--soil:light-dark(#6b4226,#c48a5c);--deep:light-dark(#3e2716,#0e0906);--leaf:light-dark(#2e7d32,#7cc47f);--gold:#e9b949;
--line:light-dark(#e8ddd2,#3a2c21);--card:light-dark(#faf6f1,#211810);--band:light-dark(#f4ece3,#1e1610);
--sky1:light-dark(#cfe8f4,#0f1a2a);--sky2:light-dark(#f7f1e4,#1d2534)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.brand b{font-family:"Zilla Slab",Georgia,serif;line-height:1.1;text-wrap:balance;margin:0 0 .5em}
h1{font-size:clamp(34px,5vw,52px)}h2{font-size:clamp(26px,3vw,34px)}h3{font-size:21px}
a{color:var(--leaf)}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}.in{max-width:1240px;margin:0 auto}
.alt{background:var(--band)}
html{scroll-padding-top:72px;overflow-x:hidden}
pre,.scroll{overflow-x:auto}.scroll a{flex:none}code{overflow-wrap:anywhere}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:16px;padding:8px max(3vw,12px);flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);margin-right:auto}
.brand svg{width:36px;height:36px}.brand-logo{width:52px;height:52px;flex:none;border-radius:10px;background:#fff;object-fit:contain;box-shadow:0 1px 4px #0002}.brand b{font-size:18px;margin:0;display:block}.brand small{display:block;color:var(--muted);font-size:13px}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{padding:10px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center}
nav.main a.on{background:var(--soil);color:var(--bg)}
nav.main a:hover:not(.on){background:var(--band)}
.search{position:relative}
.search input{font:16px inherit;font-family:inherit;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:220px;min-height:44px}
.search input:focus,a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.results{position:absolute;right:0;top:50px;width:min(420px,92vw);background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px #0003;max-height:60vh;overflow:auto;display:none}
.results.show{display:block}.results a{display:block;padding:10px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.results a:hover{background:var(--band)}.results small{display:block;color:var(--muted);font-size:14px}.results mark{background:var(--gold);color:#2a1d13}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 70%)}
.hero svg.scene{display:block;width:100%;height:clamp(230px,26vw,330px);margin-top:0}
.hero::before{content:"";position:absolute;right:8%;top:40px;width:84px;height:84px;border-radius:50%;background:#f5c64a;opacity:.9;box-shadow:0 0 60px #f5c64a88}
.hero .txt{position:relative;max-width:1240px;margin:0 auto;padding:44px max(5vw,16px) 0}
.hero .txt p{max-width:560px;font-size:19px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:10px 20px;border-radius:999px;background:var(--leaf);color:var(--bg);font-weight:700;text-decoration:none;border:0;cursor:pointer;font:inherit;font-weight:700}
.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--soil)}
.hz{font:700 15px "Zilla Slab",serif}
/* grids & cards */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.stat b{display:block;font:700 clamp(30px,4vw,42px) "Zilla Slab",serif;color:var(--soil)}.stat span{color:var(--muted)}
.unit{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);border-top:8px solid var(--c)}
.unit .w{font:700 30px "Zilla Slab",serif;color:var(--c)}
.unit.off{opacity:.75}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--band);color:var(--muted)}
.lesson{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;text-decoration:none;color:var(--ink);align-items:start}
.lesson .n{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font:700 22px "Zilla Slab",serif;color:#fff;background:var(--soil)}
.lesson:hover{border-color:var(--soil)}
.lesson p{margin:.3em 0 0;color:var(--muted);font-size:15px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--band);font-weight:700}
td.num,th.num{text-align:right;white-space:nowrap}
tr.unitrow td{background:color-mix(in srgb,var(--c) 16%,var(--bg));font-weight:700}
.mx td,.mx th{text-align:center;padding:7px}.mx td:first-child{text-align:left;font-weight:700}
.m3{background:color-mix(in srgb,var(--leaf) 45%,var(--bg))}.m2{background:color-mix(in srgb,var(--gold) 40%,var(--bg))}.m1{background:color-mix(in srgb,var(--soil) 14%,var(--bg))}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
/* gallery & slides */
.gal{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.gal button{all:unset;cursor:pointer;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.gal img{width:100%;height:150px;object-fit:contain;background:#fff}.gal span{padding:8px 10px;font-size:14px;color:#2a1d13;background:#faf6f1}
.deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;border-radius:14px;background:var(--deep);padding:12px}
.deck img{flex:0 0 100%;width:100%;scroll-snap-align:center;border-radius:8px;aspect-ratio:16/9;object-fit:contain;background:#000}
.deckbar{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.deckbar button{min-width:44px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}.tabs button.on .muted{color:inherit;opacity:.85}.tabs button.on{background:var(--soil);color:var(--bg);border-color:var(--soil)}
/* lesson reader */
.phead{background:var(--deep);color:#f1e7dc;position:relative;overflow:hidden}
.phead .crumb{font-size:15px;opacity:.85}.phead .crumb a{color:var(--gold)}
.phead h1{color:#fff;margin-top:8px}
.reader{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;max-width:1240px;margin:0 auto;padding:32px max(5vw,16px)}
.toc{position:sticky;top:84px;align-self:start;font-size:15px}
.toc summary{cursor:pointer;min-height:32px;list-style:none}.toc summary::-webkit-details-marker{display:none}.toc ol{margin-top:8px!important;list-style:none;padding:0;margin:0;border-left:3px solid var(--line)}
.toc a{display:block;padding:6px 12px;color:var(--muted);text-decoration:none;margin-left:-3px;border-left:3px solid transparent}
.toc a.on{color:var(--soil);border-color:var(--soil);font-weight:700}
.notes{max-width:820px}
.notes h2{margin-top:1.6em;padding-bottom:6px;border-bottom:2px solid var(--line)}.notes h2:first-child{margin-top:0}
.notes h3{margin-top:1.3em;color:var(--soil)}
.notes p,.notes li{max-width:72ch}
.table-wrap{overflow-x:auto;margin:18px 0;border:1px solid var(--line);border-radius:12px}
.table-wrap table{min-width:520px}.table-wrap p{margin:0}
.notes figure{margin:24px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:zoom-in}
.notes figure svg{width:100%;height:auto;display:block;font-family:"Source Sans 3",system-ui,sans-serif}.notes figure img{width:100%;height:auto;display:block;border-radius:8px}
figcaption{font-size:15px;color:#6e5a49;padding:8px 4px 0}
.callout{margin:22px 0;padding:14px 18px;border-radius:14px;background:color-mix(in srgb,var(--gold) 16%,var(--bg));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line))}
.callout.key{background:color-mix(in srgb,var(--leaf) 11%,var(--bg));border-color:color-mix(in srgb,var(--leaf) 40%,var(--line))}
.callout p{margin:4px 0}
.equation{margin:18px 0;padding:14px 18px;border-left:5px solid var(--soil);background:var(--card);border-radius:0 12px 12px 0;font-size:18px;overflow-x:auto}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0}
.flow .step{background:var(--soil);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:700}.flow .arrow{color:var(--soil);font-weight:700}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:40px}
.pager a{display:block;padding:16px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);background:var(--card)}
.pager a small{display:block;color:var(--muted)}.pager .nx{text-align:right;grid-column:2}
.progress{position:fixed;top:0;left:0;height:4px;background:var(--gold);z-index:30;width:0}
.lb{position:fixed;inset:0;background:#000d;z-index:50;display:none;place-items:center;padding:20px;cursor:zoom-out}
.lb.show{display:grid}.lb img{max-width:100%;max-height:82vh;background:#fff;border-radius:8px}.lb p{color:#fff;text-align:center;max-width:800px}
footer{background:var(--deep);color:#e9dccd;font-size:15px}footer a{color:var(--gold)}
.muted{color:var(--muted)}
.loading{padding:60px 0;color:var(--muted)}
@media(max-width:900px){.reader{grid-template-columns:minmax(0,1fr)}.toc{position:static;background:var(--card);border-radius:14px;padding:14px}.search input{width:100%}.search{flex:1 1 100%}}
@media(max-width:600px){table{font-size:14px}.hero::before{width:56px;height:56px;top:20px}.hero .txt p{font-size:17px}.pager{grid-template-columns:1fr}.pager .nx{grid-column:1}
.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--muted);font-weight:600}.stack td:empty{display:none}.brand small{display:none}.top{position:static}}
@media(prefers-reduced-motion:no-preference){.view{animation:rise .45s ease both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}}

.hook{background:var(--deep);color:#f1e7dc;border-radius:18px;padding:22px 24px;margin:0 0 28px;position:relative;overflow:hidden}
.hook h3{color:#fff;font-size:24px;margin:.2em 0 .4em}.hook p{max-width:none}.hook strong{color:var(--gold)}
.hook .lab{color:var(--gold)}
.hook::after{content:"";position:absolute;right:-40px;bottom:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#e9b94933,transparent 70%)}
.lab{font-weight:700;font-size:14px;letter-spacing:.02em;margin:0 0 6px!important}
.xp{margin:22px 0;padding:16px 20px;border-radius:14px;border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--bg))}
.xp .lab{color:var(--c)}.xp p:last-child,.xp ul:last-child{margin-bottom:0}
.xp.ex{--c:#2f7fb5}.xp.field{--c:var(--leaf)}.xp.mist{--c:#c0392b}.xp.try{--c:#b26a00}
.qz{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--card)}
.qz summary{cursor:pointer;padding:14px 16px;font-weight:600;min-height:44px;list-style:none}
.qz summary::-webkit-details-marker{display:none}.qz summary span{color:var(--soil)}
.qz summary::after{content:"Show answer";float:right;font-size:13px;color:var(--leaf);font-weight:700;margin-left:10px}
.qz[open] summary::after{content:"Hide"}
.qz p{margin:0;padding:0 16px 14px;color:var(--ink);border-top:1px dashed var(--line);padding-top:10px}
.terms{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));margin:0}
.terms div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.terms dt{font-weight:700;color:var(--soil)}.terms dd{margin:4px 0 0;font-size:15px}
@media(prefers-reduced-motion:no-preference){.qz[open] p{animation:rise .35s ease both}}

.kicker{font-weight:700;color:var(--soil);margin:0 0 8px!important;font-size:15px}
.hero h1{font-size:clamp(40px,6.5vw,72px);line-height:1;margin-bottom:.3em}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero .scene{transform:translate(calc(var(--mx,0)*-14px),calc(var(--my,0)*-6px)) scale(1.03);transition:transform .4s ease-out}
.hzlinks{position:absolute;right:max(1vw,8px);bottom:clamp(12px,3vw,30px);display:flex;flex-direction:column;gap:4px}
.hzlinks a{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#ffffffd9;color:#3e2716;font:700 15px "Zilla Slab",serif;text-decoration:none;box-shadow:0 2px 8px #0003}
.hzlinks a:hover{background:var(--gold)}
.glance{background:linear-gradient(180deg,var(--bg),var(--band))}
.glgrid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:clamp(24px,4vw,60px);align-items:center}
.donutbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut{width:180px;height:180px;flex:none;color:var(--ink)}
.legend{list-style:none;padding:0;margin:0;font-size:15px;flex:1;min-width:210px}.legend li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.legend i{width:14px;height:14px;border-radius:4px;flex:none}.legend span{margin-left:auto;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;inset:auto -20px -30px auto;width:90px;height:90px;border-radius:50%;background:color-mix(in srgb,var(--gold) 22%,transparent)}
.tile b{display:block;font:700 clamp(32px,4vw,44px)/1 "Zilla Slab",serif;color:var(--soil)}.tile span{color:var(--muted);font-size:15px}
.dig{background:linear-gradient(180deg,#3d5a2a 0,#3d5a2a 10px,var(--bg) 10px)}
.lead{max-width:640px}
.strata{border-radius:18px;overflow:hidden;box-shadow:0 20px 50px #3e271633;margin-top:18px}
.stratum{display:grid;grid-template-columns:70px 54px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 20px;background:var(--c);color:var(--t);text-decoration:none;min-height:56px;position:relative;transition:padding .3s ease,filter .3s}
.stratum::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 20% 40%,#ffffff10 0 2px,transparent 2px 14px);pointer-events:none}
.stratum .dp{font-size:13px;opacity:.75;white-space:nowrap}.stratum .sn{font:700 26px "Zilla Slab",serif}
.stratum b{display:block;font-size:17px}.stratum small{display:block;opacity:.85;font-size:14px;max-height:0;overflow:hidden;transition:max-height .35s ease}
.stratum .go{font-weight:700;font-size:14px;opacity:0;transition:opacity .3s}
.stratum:hover,.stratum:focus-visible{padding-block:20px;filter:brightness(1.12)}.stratum:hover small,.stratum:focus-visible small{max-height:80px}.stratum:hover .go,.stratum:focus-visible .go{opacity:1}
.cine{background:var(--deep);color:#f1e7dc}.cine h2{color:#fff}.cine .muted{color:#c2ae9b}
.chipsrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fchip{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid #ffffff33;background:transparent;color:#f1e7dc;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.fchip.on{background:var(--gold);color:#2a1d13;border-color:var(--gold)}
.stage{position:relative;aspect-ratio:16/9;max-height:620px;width:100%;border-radius:18px;overflow:hidden;background:#fff}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:18px 18px 70px;transition:opacity .9s ease}
.stage img.hide{opacity:0}
.cap{position:absolute;left:0;right:0;bottom:0;padding:14px 20px;background:linear-gradient(transparent,#1d130bd9 30%);color:#fff;display:flex;gap:6px 16px;align-items:baseline;flex-wrap:wrap}
.cap span{font-size:13px;opacity:.8}.cap b{font:700 clamp(17px,2vw,22px) "Zilla Slab",serif;flex:1 1 260px}.cap a{color:var(--gold);font-weight:700;white-space:nowrap}
.stage .nav{position:absolute;top:42%;width:48px;height:48px;border-radius:50%;border:0;background:#2a1d13b3;color:#fff;font-size:28px;cursor:pointer}.nav.prev{left:12px}.nav.next{right:12px}
.stage .play{position:absolute;top:12px;right:12px;min-height:36px;padding:4px 14px;border-radius:999px;border:0;background:#2a1d13b3;color:#fff;font:inherit;font-size:14px;cursor:pointer}
.pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#ffffff22}.pbar i{display:block;height:100%;width:0;background:var(--gold)}
.pbar i.run{animation:pb 5.5s linear forwards}@keyframes pb{to{width:100%}}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 2px 4px}
.strip button{flex:0 0 120px;height:76px;border-radius:10px;overflow:hidden;border:3px solid transparent;background:#fff;padding:0;cursor:pointer;scroll-snap-align:center;opacity:.6;transition:opacity .3s,border-color .3s}
.strip button.on{border-color:var(--gold);opacity:1}.strip img{width:100%;height:100%;object-fit:cover}
.units3{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.u3{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:0 20px 20px;transition:transform .3s,box-shadow .3s}
.u3pic{display:block;margin:0 -20px 12px;width:calc(100% + 40px);height:90px;background:#cfe8f4}
.u3 .w{font:700 32px "Zilla Slab",serif;color:var(--c)}.u3 h3{margin:0}.u3.off{opacity:.85}
.cos{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.co{display:flex;gap:14px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px}.co svg{width:64px;height:64px;flex:none;color:var(--ink)}.co p{margin:0}
@media(max-width:800px){.glgrid{grid-template-columns:minmax(0,1fr)}.glgrid>div:last-child{order:-1}.hero::before{top:-14px;right:-14px}.stratum{grid-template-columns:48px 40px minmax(0,1fr)}.stratum .go{display:none}.stratum small{max-height:none}.stage{aspect-ratio:4/3}.stage img{padding:10px 10px 90px}.hzlinks{display:none}}
@media(prefers-reduced-motion:no-preference){
.stage img.kb{animation:kb 6s ease-out both}@keyframes kb{from{transform:scale(1.07)}to{transform:scale(1)}}
.vis .arc,.glance.vis .arc{animation:arc 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes arc{from{stroke-dasharray:0 100}}
.co.vis .ring{animation:arc 1.6s ease both}
.stratum{animation:none}
.dig .strata.vis .stratum{animation:layer .6s ease both}
@keyframes layer{from{opacity:0;transform:translateX(-30px)}}
.u3:hover{transform:translateY(-6px);box-shadow:0 18px 36px #3e271630}
}

/* ===== Three units, one journey (photo design) ===== */
.hero.photo .hs{object-fit:cover}
.jr{background:radial-gradient(900px 480px at 8% 0%,color-mix(in srgb,#7ed957 16%,transparent),transparent),radial-gradient(900px 480px at 100% 100%,color-mix(in srgb,#ff8c42 16%,transparent),transparent),var(--bg)}
.jr-kick{text-transform:uppercase;letter-spacing:.14em;font-size:13px;font-weight:700;color:#e8590c;margin:0 0 6px}
.jr-title{font-size:clamp(34px,5.4vw,58px)}.jr-title span{background:linear-gradient(90deg,#2e7d32,#f4a300,#e8590c);-webkit-background-clip:text;background-clip:text;color:transparent}
.jr-path{position:relative;display:grid;gap:56px;margin-top:28px}
.jr-line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.jr-line path{fill:none;stroke:#c9a46a;stroke-width:5;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:100;stroke-dashoffset:100;opacity:.6}
.jr-stop{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 18px 40px #3e27161f;opacity:0;transform:translateY(40px);transition:opacity .9s,transform .9s}
.jr-stop.jin{opacity:1;transform:none}
.jr-flip .jr-pic{order:2}
.jr-pic{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3}
.jr-pic img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 1.8s ease}
.jr-stop.jin .jr-pic img{transform:scale(1)}.jr-stop:hover .jr-pic img{transform:scale(1.06)}
.jr-num{position:absolute;left:16px;top:10px;font:700 76px/1 "Zilla Slab",serif;color:#fff;text-shadow:0 4px 20px #0008}
.jr-ring{position:absolute;right:14px;bottom:14px;width:104px;height:104px;transform:rotate(-90deg);background:#0007;border-radius:50%}
.jr-ring circle{fill:none;stroke:var(--jc);stroke-width:9;stroke-linecap:round;stroke-dasharray:0 100;transition:stroke-dasharray 1.6s ease .5s}
.jr-stop.jin .jr-ring circle{stroke-dasharray:var(--p) 100}
.jr-val{position:absolute;right:14px;bottom:14px;width:104px;height:104px;display:grid;place-items:center;color:#fff;font:700 24px "Zilla Slab",serif}
.jr-tag{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--jc)}
.jr-body h3{font-size:clamp(28px,3.2vw,40px);margin:6px 0;color:var(--jc)}
.jr-sub{color:var(--muted);font-size:18px;margin:0 0 10px}
.jr-ticks{list-style:none;padding:0;margin:0 0 18px}.jr-ticks li{position:relative;padding:5px 0 5px 32px}
.jr-ticks li::before{content:"✓";position:absolute;left:0;top:7px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--jc)}
.jr-finish{margin:48px auto 0;max-width:660px;display:flex;gap:16px;align-items:center;padding:18px 24px;border-radius:20px;color:#fff;background:linear-gradient(110deg,#2e7d32,#f4a300 60%,#e8590c);box-shadow:0 18px 40px #3e27162a}
.jr-finish span{font-size:40px}.jr-finish p{margin:2px 0 0;opacity:.95}
.jr-sts{background:linear-gradient(180deg,#13240f,#1f3a18);color:#eaf5e3}.jr-sts h2{color:#fff}.jr-sts .jr-kick{color:#ffd23f}
.jr-stations{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;position:relative;margin-top:20px}
.jr-stations::before{content:"";position:absolute;left:5%;right:5%;top:calc(50% - 64px);height:4px;background:repeating-linear-gradient(90deg,#ffd23f 0 14px,transparent 14px 26px);opacity:.6;animation:jrm 1.2s linear infinite}
@keyframes jrm{to{background-position:26px 0}}
.jr-st{position:relative;text-align:center}
.jr-stimg{aspect-ratio:1;border-radius:50%;overflow:hidden;border:4px solid #ffffffd9;box-shadow:0 10px 30px #0008;transition:transform .4s}
.jr-stimg img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.jr-st:hover .jr-stimg{transform:translateY(-6px)}.jr-st:hover .jr-stimg img{transform:scale(1.15)}
.jr-dot{position:relative;display:inline-grid;place-items:center;width:34px;height:34px;margin-top:-18px;border-radius:50%;background:#ffd23f;color:#1d3517;font-weight:800;animation:jrp 2.4s infinite;animation-delay:calc(var(--i)*.3s)}
@keyframes jrp{0%{box-shadow:0 0 0 0 #ffd23f88}70%{box-shadow:0 0 0 14px #ffd23f00}}
.jr-st h4{color:#fff;margin:10px 0 2px;font-size:17px}.jr-st p{margin:0;font-size:14px;color:#c9dcc0}
.jr-u{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:#ffffff1f}
.jr-mosaic{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:220px;gap:14px}
.jr-tile{position:relative;margin:0;border-radius:20px;overflow:hidden;box-shadow:0 14px 30px #3e27161f}
.jr-tile.w{grid-column:span 2}.jr-tile.t{grid-row:span 2}
.jr-tile img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s}.jr-tile:hover img{transform:scale(1.1)}
.jr-tile figcaption{position:absolute;inset:auto 0 0;padding:30px 16px 12px;font:700 19px "Zilla Slab",serif;color:#fff;background:linear-gradient(transparent,#000b)}
@media (max-width:900px){.jr-stations{grid-template-columns:repeat(3,1fr);row-gap:28px}.jr-stations::before{display:none}.jr-mosaic{grid-template-columns:repeat(2,1fr);grid-auto-rows:170px}}
@media (max-width:760px){.jr-stop{grid-template-columns:1fr;gap:16px}.jr-flip .jr-pic{order:0}.jr-line{display:none}}
@media (max-width:480px){.jr-stations{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.jr-stop{opacity:1;transform:none}.jr-line path{stroke-dashoffset:0}}

/* ===== Notes: three unit tabs ===== */
.unotes .utabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;margin:26px 0 22px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 14px 34px #3e27161a}
.unotes .utab{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;border-radius:16px;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:color .35s,transform .2s}
.unotes .utab:hover:not(.on){background:color-mix(in srgb,var(--tc) 9%,transparent)}
.unotes .utab:active{transform:scale(.98)}
.unotes .utab .ui{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;font-size:24px;background:color-mix(in srgb,var(--tc) 14%,transparent);transition:background .35s,transform .45s cubic-bezier(.3,1.6,.5,1)}
.unotes .utab.on .ui{background:#ffffff2e;transform:rotate(-8deg) scale(1.06)}
.unotes .utab .ul{display:flex;flex-direction:column;line-height:1.2}.unotes .utab b{font:700 19px "Zilla Slab",serif}.unotes .utab small{font-size:13px;opacity:.8}
.unotes .utab.on{color:#fff}
.unotes .uind{position:absolute;top:6px;left:0;height:calc(100% - 12px);border-radius:16px;z-index:0;transition:transform .55s cubic-bezier(.6,.05,.2,1),width .55s cubic-bezier(.6,.05,.2,1),background .55s;box-shadow:0 10px 24px #0003}
@media(max-width:640px){.unotes .utab{flex-direction:column;gap:4px;padding:10px 4px;text-align:center}.unotes .utab small{display:none}.unotes .utab .ui{width:38px;height:38px;font-size:20px}.unotes .utab b{font-size:16px}}
.upanel{animation:upIn .6s cubic-bezier(.2,.7,.2,1) both}#upanel.swap .upanel{animation:upIn .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes upIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.uban{position:relative;display:grid;grid-template-columns:1fr auto;align-items:end;gap:18px;min-height:260px;border-radius:26px;overflow:hidden;padding:clamp(18px,3vw,34px);color:#fff;isolation:isolate;box-shadow:0 22px 44px #0000002e}
.uban img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;animation:ubZoom 18s ease-in-out infinite alternate}@keyframes ubZoom{to{transform:scale(1.08)}}
.uban::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,color-mix(in srgb,var(--jc) 82%,#000) 0%,color-mix(in srgb,var(--jc) 45%,transparent) 55%,#0000 100%)}
.uban h3{color:#fff;font-size:clamp(30px,4vw,46px);margin:2px 0 6px}.uban p{margin:0;max-width:52ch}
.ubk{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.ubflow{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ubflow span{padding:5px 12px;border-radius:999px;background:#ffffff26;backdrop-filter:blur(4px);font-weight:700;font-size:14px;animation:upIn .5s both;animation-delay:calc(var(--i)*70ms + .2s)}
.ubring{position:relative;width:110px;height:110px;display:grid;place-items:center;text-align:center}
.ubring svg{position:absolute;inset:0}.ubring b{font:700 26px "Zilla Slab",serif;margin-top:-10px}.ubring small{position:absolute;bottom:26px;font-size:11px;opacity:.85}
.ubarc{animation:ubArc 1.4s .3s cubic-bezier(.2,.7,.2,1) both}@keyframes ubArc{from{stroke-dasharray:0 100}}
@media(max-width:640px){.uban{grid-template-columns:1fr}.ubring{width:90px;height:90px}}
.ulist{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.ulist li{animation:upIn .5s both;animation-delay:calc(var(--i)*60ms + .15s)}
.ucard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;height:100%;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink);transition:transform .3s,box-shadow .3s,border-color .3s;position:relative}
.ucard:hover{transform:translateY(-4px);box-shadow:0 16px 30px #3e271624;border-color:color-mix(in srgb,var(--jc) 45%,var(--line))}
.ucard .sn{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--jc);color:#fff;font:700 20px "Zilla Slab",serif;transition:transform .3s}
.ucard:hover .sn{transform:rotate(-6deg) scale(1.08)}
.ucard .ut{display:flex;flex-direction:column;gap:3px}.ucard .ut small{color:var(--muted);font-size:13px}.ucard .ut b{font:700 18px/1.25 "Zilla Slab",serif}.ucard .ut>span{color:var(--muted);font-size:14.5px;line-height:1.45}
.ucard .go{grid-column:2;font-size:13px;font-weight:700;color:var(--jc)}
.ucard.lk{border-style:dashed;background:color-mix(in srgb,var(--jc) 4%,var(--card))}.ucard.lk .sn{background:color-mix(in srgb,var(--jc) 18%,var(--card));color:var(--jc)}.ucard.lk .ut b,.ucard.lk .ut>span{opacity:.75}
.ucard.lk em{font-style:normal;color:light-dark(#9b2c1f,#f0a59a);font-weight:700}
.lki{width:24px;height:24px}
/* lock screen */
.lockcard{text-align:center;max-width:620px;margin:10px auto 30px;padding:clamp(24px,4vw,44px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,color-mix(in srgb,var(--uc) 8%,var(--card)),var(--card))}
.lkart{width:120px;margin:0 auto 14px;color:var(--uc)}.lkart svg{display:block;width:100%}
.lkring{transform-origin:60px 60px;animation:lkspin 3.2s linear infinite}@keyframes lkspin{to{transform:rotate(360deg)}}
.lkbody{animation:lkbob 2.6s ease-in-out infinite}@keyframes lkbob{50%{transform:translateY(-3px)}}
.lockcard h2{margin-top:0}
.tpreview{margin-top:22px;text-align:left;border-top:1px solid var(--line);padding-top:14px}.tpreview summary{cursor:pointer;color:var(--muted);font-size:14px}
.pwrow{display:flex;gap:8px;margin-top:6px}.pwrow input{flex:1;font:16px inherit;font-family:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
/* animated scenes in lecture notes */
.notes figure.scene{background:var(--deep);border:0;padding:0;border-radius:18px;overflow:hidden;margin:0 0 26px;box-shadow:0 18px 40px #3e271633}
.notes figure.scene svg{display:block;width:100%;height:auto;aspect-ratio:8/3}
.notes figure.scene figcaption{color:#f1e7dc;padding:10px 16px 14px;font:700 18px "Zilla Slab",serif}
.notes figure.scene .vbar{display:flex;align-items:center;gap:8px;padding:10px 16px;color:#e9b949;font-weight:700;font-size:14px}.notes figure.scene .vbar .dot{width:9px;height:9px;border-radius:50%;background:#e74c3c;animation:scBlink 1.4s infinite}@keyframes scBlink{50%{opacity:.3}}
.sc-sun{transform-box:fill-box;transform-origin:center;animation:scSun 6s ease-in-out infinite alternate}@keyframes scSun{to{transform:scale(1.08)}}
.sc-cloud{animation:scCloud 38s linear infinite;animation-delay:var(--d)}@keyframes scCloud{from{transform:translate(-120px,var(--y))}to{transform:translate(920px,var(--y))}}
.sc-sway{transform-box:fill-box;transform-origin:50% 100%;animation:scSway 3s ease-in-out infinite alternate;animation-delay:var(--d)}@keyframes scSway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.sc-rain{animation:scRain 1.1s linear infinite;animation-delay:var(--d)}@keyframes scRain{from{transform:translateY(0);opacity:0}20%{opacity:1}to{transform:translateY(110px);opacity:0}}
.sc-lab{animation:scLab 1s ease both;animation-delay:var(--d)}@keyframes scLab{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sc-tractor{animation:scDrive 14s linear infinite}@keyframes scDrive{from{transform:translateX(-120px)}to{transform:translateX(900px)}}
.sc-drill{animation:scDrive 10s linear infinite}.sc-truck{animation:scDrive 9s linear infinite}
.sc-seed{opacity:0;animation:scSeed 10s linear infinite;animation-delay:var(--d)}@keyframes scSeed{0%,8%{opacity:0;transform:translateY(-14px)}14%,100%{opacity:1;transform:none}}
.sc-season{opacity:0;animation:scSeason 12s infinite}.sc-season.s2{animation-delay:4s}.sc-season.s3{animation-delay:8s}@keyframes scSeason{0%{opacity:0}6%,30%{opacity:1}36%,100%{opacity:0}}
.sc-rays{animation:scRays 2.2s ease-in-out infinite alternate}@keyframes scRays{from{opacity:.35}to{opacity:1}}
.sc-wind{animation:scWind 3s ease-in-out infinite}@keyframes scWind{0%{transform:translateX(-30px);opacity:0}40%{opacity:1}100%{transform:translateX(160px);opacity:0}}
.sc-water{animation:scWater 3s ease-in-out infinite alternate}@keyframes scWater{to{transform:translateY(3px);opacity:.6}}
.sc-boll{transform-box:fill-box;transform-origin:center;animation:scBoll 5s ease-in-out infinite;animation-delay:var(--d)}@keyframes scBoll{0%,10%{transform:scale(0)}30%,85%{transform:scale(1)}100%{transform:scale(0)}}
.sc-pop{transform-box:fill-box;transform-origin:center;animation:scPop 7s cubic-bezier(.3,1.5,.5,1) infinite;animation-delay:var(--d)}@keyframes scPop{0%{transform:scale(0);opacity:0}8%,80%{transform:scale(1);opacity:1}92%,100%{transform:scale(.6);opacity:0}}
.sc-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:scDraw 7s ease infinite;animation-delay:var(--d)}@keyframes scDraw{0%{stroke-dashoffset:400}15%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:400}}
.sc-down{animation:scDown 2s linear infinite;animation-delay:var(--d)}@keyframes scDown{from{transform:translateY(0);opacity:1}to{transform:translateY(150px);opacity:0}}
.sc-up{animation:scUp 2s linear infinite;animation-delay:var(--d)}@keyframes scUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-190px);opacity:0}}
.sc-cut{animation:scCut 6s ease infinite}@keyframes scCut{0%,30%{opacity:1}45%,100%{opacity:0;transform:translateY(40px)}}
.sc-shears{animation:scShear 6s ease infinite}@keyframes scShear{0%{transform:translate(0,0)}25%{transform:translate(-160px,-20px)}40%{transform:translate(-200px,-10px)}60%,100%{transform:translate(0,0)}}
.sc-drip{animation:scDrip 1.6s ease-in infinite;animation-delay:var(--d)}@keyframes scDrip{from{transform:translateY(0);opacity:1}to{transform:translateY(26px);opacity:0}}
.sc-wet{transform-box:fill-box;transform-origin:center;animation:scWet 3.2s ease-in-out infinite;animation-delay:var(--d)}@keyframes scWet{0%{transform:scale(.3);opacity:0}50%{opacity:.35}100%{transform:scale(1.1);opacity:0}}
@media(prefers-reduced-motion:reduce){.notes figure.scene *,.lockcard *,.upanel,.ulist li,.ubflow span,.uban img,.ubarc,.unotes .uind{animation:none!important;transition:none!important}.sc-season.s1,.sc-seed{opacity:1}.sc-boll,.sc-pop{transform:none;opacity:1}.sc-draw{stroke-dashoffset:0}}

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('click',e=>{const c=e.target.closest('[data-cin]');if(c){cinShow(cin.i+ +c.dataset.cin);return}
 const s=e.target.closest('[data-ci]');if(s){cinShow(+s.dataset.ci);return}
 const t=e.target.closest('[data-th]');if(t){cin.th=t.dataset.th;document.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('on',x==t));cinInit();return}
 if(e.target.id=='cplay'){cin.paused=!cin.paused;e.target.textContent=cin.paused?'Play':'Pause';e.target.setAttribute('aria-label',cin.paused?'Play slideshow':'Pause slideshow');cinShow(cin.i,true)}});
document.addEventListener('keydown',e=>{if(e.target.id=='cin'&&(e.key=='ArrowRight'||e.key=='ArrowLeft')){e.preventDefault();cinShow(cin.i+(e.key=='ArrowRight'?1:-1))}});
document.addEventListener('mousemove',e=>{const h=document.getElementById('hero');if(!h||RM)return;const ar=h.querySelector('.art');if(ar)ar.style.transform=`translate(${(e.clientX/innerWidth-.5)*-12}px,${(e.clientY/innerHeight-.5)*-8}px)`;const r=h.getBoundingClientRect();if(e.clientY>r.bottom)return;const dx=(e.clientX/innerWidth-.5),dy=(e.clientY/innerHeight-.5);h.style.setProperty('--mx',dx);h.style.setProperty('--my',dy)},{passive:true});

function gallery(list){return `<div class="gal">${list.map(f=>`<button data-fig="${f[1]}" data-cap="${esc(f[2])}" data-go="${f[0]}"><img loading="lazy" src="${fig(f[1])}" alt="${esc(f[2])}"><span>${esc(f[2])} · Lecture ${num(f[0])}</span></button>`).join('')}</div>`}
function deckHtml(d,i){return `<div class="deck" id="deck${i}" tabindex="0" aria-label="${esc(d[1])} slides">${Array.from({length:d[3]},(_,k)=>`<img loading="lazy" src="slides/${d[0]}/s-${String(k+1).padStart(2,'0')}.jpg" alt="${esc(d[1])} – slide ${k+1}">`).join('')}</div>
 <div class="deckbar"><button data-dk="${i}" data-dir="-1" aria-label="Previous slide">‹</button><button data-dk="${i}" data-dir="1" aria-label="Next slide">›</button><span class="muted" id="cnt${i}">Slide 1 of ${d[3]}</span><button data-fs="${i}" style="padding:0 16px">Full screen</button></div>`}
let curDeck=0;
function slides(){
 return `<section class="phead band"><div class="in"><div class="crumb"><a href="#home">Home</a> › Slides</div><h1>Lecture slides</h1><p>Unit I slide decks. Swipe, use the arrow buttons or your keyboard's ← → keys.</p></div></section>
 <section class="band"><div class="in"><div class="tabs" id="tabs">${DECKS.map((d,i)=>`<button data-tab="${i}" class="${i==curDeck?'on':''}">${d[1]} <span class="muted">· ${d[2]} · ${d[3]} slides</span></button>`).join('')}</div>
 <div id="deckbox">${deckHtml(DECKS[curDeck],curDeck)}</div><p><a href="#${DECKS[curDeck][4]}" id="decklink">Read the related lecture: ${L.find(l=>l[0]==DECKS[curDeck][4])[2]}</a></p></div></section>`;
}
async function getLesson(id){if(!cache[id]){const r=await fetch(`lessons/${id}.html`);if(!r.ok)throw new Error(r.status);cache[id]=await r.text()}return cache[id]}
async function lesson(id){
 const U=uOf(id),LL=U.list(),i=LL.findIndex(l=>l[0]==id),l=LL[i],p=LL[i-1],n=LL[i+1],dk=DECKS.findIndex(d=>d[4]==id);
 app.innerHTML=`<div class="view"><section class="phead band"><div class="in"><div class="crumb">${U.name} › ${id.startsWith("as")?"Assignment":id.startsWith("bx")?"Topic":"Lecture"} ${num(id)}</div><h1>${id.startsWith("as")?"Assignment No. "+num(id)+" – ":num(id)+". "}${l[2]}</h1><p>${id.startsWith("as")?l[4]+" questions with answers · "+l[1]:l[1]=="Beyond"?"Beyond the syllabus":"Lecture "+l[1]} · ${U.name}${id.startsWith("as")?"":" · "+U.co}</p></div></section>
 <div class="reader"><details class="toc" id="tocbox" ${innerWidth>900?"open":""}><summary><b>Contents</b></summary><ol id="toc"></ol></details><article class="notes" id="notes"><p class="loading">Loading the notes…</p></article></div></div>`;
 if(LOCKED.has(id)&&!cache[id]){const sp=sessionStorage.getItem('cptpw');if(sp){try{cache[id]=await decryptLesson(id,sp)}catch(_){}}}
 if(isLk(id)){const nt=document.getElementById('notes');nt.innerHTML=lockView(id,U,l)+`<nav class="pager">${p?`<a href="#${p[0]}"><small>← Previous</small>${num(p[0])}. ${p[2]}</a>`:''}${n?`<a class="nx" href="#${n[0]}"><small>Next →</small>${num(n[0])}. ${n[2]}</a>`:''}</nav>`;
  document.getElementById('toc').innerHTML='<li class="muted">Released after the lecture</li>';
  document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value,m=document.getElementById('pwmsg');m.textContent='Checking…';
   try{cache[id]=await decryptLesson(id,pw);sessionStorage.setItem('cptpw',pw);all=null;lesson(id)}catch(_){m.textContent='That passphrase did not work.'}});return}
 let h;try{h=await getLesson(id)}catch(e){document.getElementById('notes').innerHTML='<p class="loading">These notes could not be loaded. Please refresh the page.</p>';return}
 if(location.hash.slice(1)!=id)return;
 const nt=document.getElementById('notes');
 nt.innerHTML=h+(dk>=0?`<h2 id="slides-${dk}">Lecture slides – ${esc(DECKS[dk][1])}</h2>${deckHtml(DECKS[dk],dk)}`:'')+
 `<nav class="pager">${p?`<a href="#${p[0]}"><small>← Previous</small>${num(p[0])}. ${p[2]}</a>`:''}${n?`<a class="nx" href="#${n[0]}"><small>Next →</small>${num(n[0])}. ${n[2]}</a>`:''}</nav>`;
 nt.querySelectorAll('.table-wrap table').forEach(t=>{if(t.rows[0]&&t.rows[0].cells.length<=4)t.classList.add('stack')});
 const hs=[...nt.querySelectorAll('h2[id]')];
 document.getElementById('toc').innerHTML=hs.map(x=>`<li><a href="#${id}" data-to="${x.id}">${esc(x.textContent)}</a></li>`).join('');
 watchToc(hs);
 if(window.initSims)initSims(nt);
}
let io;
function watchToc(hs){io&&io.disconnect();io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('#toc a').forEach(a=>a.classList.toggle('on',a.dataset.to==e.target.id))}})},{rootMargin:'-80px 0px -70% 0px'});hs.forEach(h=>io.observe(h))}
function route(){
 const v=location.hash.slice(1)||'home';
 let key=v;
 const PG={syllabus:pSyllabus,assignments:pAssign,beyond:pBeyond},UJ={'unit-1':'n-u1','unit-2':'n-u2','unit-3':'n-u3'};
 if(PG[v]){app.innerHTML=`<div class="view">${PG[v]()}</div>`}
 else if(v=='notes'){location.replace('#unit-1');return}
 else if(UJ[v]){curU=+v.slice(-1);app.innerHTML=`<div class="view">${pUnit(curU)}</div>`;key='u'+curU}
 else if(ALL().some(l=>l[0]==v)){lesson(v);key=v.startsWith('bx')?'beyond':v.startsWith('as')?'assignments':'u'+v[1]}
 else {app.innerHTML=`<div class="view">${home()}</div>`;key='home'}
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==key));cin.th='all';cinInit();
 scrollTo(0,0);
 if(window.pendingSec){const t=window.pendingSec;window.pendingSec=null;setTimeout(()=>{const el=document.getElementById(t);el&&el.scrollIntoView()},80)}
}
function slideBy(i,dir){const d=document.getElementById('deck'+i);if(!d)return;d.scrollBy({left:dir*d.clientWidth,behavior:'smooth'})}
document.addEventListener('scroll',e=>{const t=e.target;if(t.classList&&t.classList.contains('deck')){const i=t.id.slice(4),k=Math.round(t.scrollLeft/t.clientWidth)+1,c=document.getElementById('cnt'+i);if(c)c.textContent=`Slide ${k} of ${t.children.length}`}},true);
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-to]');if(a){e.preventDefault();document.getElementById(a.dataset.to)?.scrollIntoView({behavior:'smooth'});return}
 const b=e.target.closest('[data-dk]');if(b){slideBy(b.dataset.dk,+b.dataset.dir);return}
 const fsb=e.target.closest('[data-fs]');if(fsb){const d=document.getElementById('deck'+fsb.dataset.fs);try{d.requestFullscreen&&d.requestFullscreen().catch(()=>{})}catch(_){}return}
 const t=e.target.closest('[data-tab]');if(t){curDeck=+t.dataset.tab;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x==t));document.getElementById('deckbox').innerHTML=deckHtml(DECKS[curDeck],curDeck);const dl=document.getElementById('decklink');dl.href='#'+DECKS[curDeck][4];dl.textContent='Read the related lecture: '+L.find(l=>l[0]==DECKS[curDeck][4])[2];return}
 const g=e.target.closest('[data-fig]');if(g){openLb(fig(g.dataset.fig),g.dataset.cap+' — Lecture '+num(g.dataset.go),g.dataset.go);return}
 if(e.target.closest('.credit,.vcard'))return;const f=e.target.closest('.notes figure:not(.vid)');if(f){const im=f.querySelector('img');if(im)openLb(im.getAttribute('src'),f.querySelector('figcaption')?.textContent||'');return}
 if(e.target.closest('#lb')){if(e.target.id=='lbgo')return;document.getElementById('lb').classList.remove('show');return}
 if(!e.target.closest('.search'))res.classList.remove('show');
});
function openLb(src,cap,go){document.getElementById('lbimg').src=src;document.getElementById('lbcap').innerHTML=esc(cap)+(go?` · <a id="lbgo" href="#${go}" style="color:#e9b949">Open lecture</a>`:'');document.getElementById('lb').classList.add('show')}
document.addEventListener('keydown',e=>{
 if(e.key=='Escape'){document.getElementById('lb').classList.remove('show');res.classList.remove('show')}
 if(e.target.matches('input'))return;
 const d=document.querySelector('.deck');if(d&&(e.key=='ArrowRight'||e.key=='ArrowLeft')){slideBy(d.id.slice(4),e.key=='ArrowRight'?1:-1)}
});
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id=='lbgo')document.getElementById('lb').classList.remove('show')});
/* search */
const q=document.getElementById('q'),res=document.getElementById('res');let all=null;
async function loadAll(){if(all)return all;all=await Promise.all(ALL().filter(l=>!isLk(l[0])).map(async l=>{let t='';try{const d=document.createElement('div');d.innerHTML=await getLesson(l[0]);t=d.textContent.replace(/\s+/g,' ')}catch(_){}return [l,t]}));return all}
let timer;
q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(async()=>{const s=q.value.trim().toLowerCase();if(s.length<2){res.classList.remove('show');return}
 const data=await loadAll();const out=[];
 for(const [l,t] of data){const tl=t.toLowerCase(),i=tl.indexOf(s),inT=l[2].toLowerCase().includes(s);if(i<0&&!inT)continue;
  let snip=i>=0?t.slice(Math.max(0,i-50),i+s.length+70):l[3];const k=snip.toLowerCase().indexOf(s);
  snip=k>=0?esc(snip.slice(0,k))+'<mark>'+esc(snip.slice(k,k+s.length))+'</mark>'+esc(snip.slice(k+s.length)):esc(snip);
  out.push(`<a href="#${l[0]}"><b>${uOf(l[0]).name.split(' –')[0]} · ${num(l[0])}. ${esc(l[2])}</b><small>…${snip}…</small></a>`)}
 res.innerHTML=out.length?out.join(''):`<a><small>No lecture mentions “${esc(q.value.trim())}”.</small></a>`;res.classList.add('show')},180)});
res.addEventListener('click',e=>{if(e.target.closest('a[href]')){res.classList.remove('show');q.value=''}});
addEventListener('scroll',()=>{const h=document.documentElement;document.getElementById('totop').classList.toggle('show',h.scrollTop>700);document.getElementById('prog').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+'%'},{passive:true});

let rvo;
function reveal(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.notes figure').forEach(f=>f.classList.add('vis'));return}
 if(rvo){}
 rvo=rvo||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');rvo.unobserve(e.target);const b=e.target.matches('.tile')?e.target.querySelector('b[data-n]:not([data-done])'):e.target.querySelector('b[data-n]:not([data-done])');if(b){b.dataset.done=1;countUp(b)}}}),{rootMargin:'0px 0px -8% 0px'});
 document.querySelectorAll('#app .card,#app .gal button,#app h2,.notes p,.notes ul,.notes ol,.notes figure,.notes .table-wrap,.notes .callout,.notes .equation,.notes .xp,.notes .hook,.notes .qz,.notes .fact,.notes .esec,#app .pcard,#app .donutbox,#app .strata,#app .co,#app .tile,#app .u3,#app .stage,.notes h2,.notes .simwrap,.notes .vcard').forEach((el,i)=>{if(el.classList.contains('rv'))return;el.classList.add('rv');el.style.transitionDelay=(el.matches('.card,.gal button')?(i%4)*80:0)+'ms';rvo.observe(el)})}
function countUp(b){const n=+b.dataset.n,suf=b.dataset.s||'',t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/1000);b.textContent=Math.round(n*(1-(1-k)**3))+suf;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
new MutationObserver(()=>{clearTimeout(window.__rv);window.__rv=setTimeout(reveal,30)}).observe(document.getElementById('app'),{childList:true,subtree:true});
document.getElementById('totop').addEventListener('click',()=>scrollTo({top:0,behavior:RM?'auto':'smooth'}));
new MutationObserver(()=>{document.querySelectorAll('.phead:not([data-sp])').forEach(p=>{p.dataset.sp=1;for(let i=0;i<14;i++){const d=document.createElement('i');d.className='spark';d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${-Math.random()*7}s;width:${3+Math.random()*6}px;height:${3+Math.random()*6}px`;p.appendChild(d)}})}).observe(document.getElementById('app'),{childList:true});

let vio;function vids(){vio=vio||new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting&&!RM){const p=v.play();p&&p.catch(()=>{})}else v.pause()}),{threshold:.5});document.querySelectorAll('.notes video:not([data-o])').forEach(v=>{v.dataset.o=1;vio.observe(v)})}
new MutationObserver(()=>{clearTimeout(window.__vv);window.__vv=setTimeout(vids,60)}).observe(document.getElementById('app'),{childList:true,subtree:true});

let hsi=0;function hshow(k){const im=[...document.querySelectorAll('.hslides img')];if(!im.length)return;hsi=(k+im.length)%im.length;im.forEach((x,j)=>x.classList.toggle('on',j==hsi));document.querySelectorAll('.hdot').forEach((x,j)=>x.classList.toggle('on',j==hsi))}
setInterval(()=>{if(document.getElementById('hero')&&!RM&&!document.hidden)hshow(hsi+1)},7000);
document.addEventListener('click',e=>{const d=e.target.closest('[data-hs]');if(d)hshow(+d.dataset.hs)});
addEventListener('hashchange',route);
route();
const row=document.getElementById('row');
if(row){}
function plantRow(){const r=document.getElementById('row');if(r&&!r.children.length)r.innerHTML=Array.from({length:30},(_,i)=>`<g class="sway" style="animation-delay:${(i%6)*-.5}s"><use href="#plant" x="${20+i*48}" y="272"/></g>`).join('')}
plantRow();addEventListener('hashchange',plantRow);
}
</script>
<script src="widgets.js"></script>
<script>
(function(){
 function jrInit(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('jin');io.unobserve(e.target)}}),{threshold:.15});
  document.querySelectorAll('.jr-stop:not(.jin)').forEach(el=>io.observe(el));
 }
 function jrLine(){const b=document.querySelector('.jr-path'),p=document.querySelector('.jr-line path');if(!b||!p)return;const r=b.getBoundingClientRect();const k=Math.min(1,Math.max(0,(innerHeight*.75-r.top)/r.height));p.style.strokeDashoffset=100-k*100}
 addEventListener('scroll',jrLine,{passive:true});
 new MutationObserver(()=>{jrInit();jrLine()}).observe(document.body,{childList:true,subtree:true});
 addEventListener('load',()=>{jrInit();jrLine()});
})();
</script>
</body>
</html>
